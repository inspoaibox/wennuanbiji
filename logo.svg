  <rect x="128" y="128" width="768" height="768" rx="176" fill="#F6B978"/>

  <!-- Note page -->
  <path d="M292 246c0-22 18-40 40-40h272l128 128v394c0 28-22 50-50 50H332c-22 0-40-18-40-40V246Z" fill="#FFFDF8"/>
  <path d="M604 206v104c0 14 12 26 26 26h102" fill="#FFE3BE"/>
  <path d="M604 206v104c0 14 12 26 26 26h102" fill="none" stroke="#E8A15D" stroke-width="14" stroke-linejoin="round"/>

  <!-- Writing lines -->
  <path d="M366 426h270M366 502h208M366 578h238" fill="none" stroke="#E8A15D" stroke-width="18" stroke-linecap="round"/>

  <!-- Pencil -->
