<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">温暖笔记 logo</title>
  <desc id="desc">暖色圆角方形中的笔记页、铅笔和小心形</desc>

  <!-- Full-bleed background; the foreground stays inside the 160..864 safe area. -->
