    <path d="M608 806l14 22 14-22" fill="none" stroke="#7C5146" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M576 710h92" stroke="#FFF4E8" stroke-width="14"/>
  </g>

  <!-- Small heart accent -->
  <path d="M744 390c-22-28-70-13-70 25 0 38 70 78 70 78s70-40 70-78c0-38-48-53-70-25Z" fill="#F08A76"/>
